
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Leave Management System</h1>

    <!-- Login -->
    <section id="login-section">
        <h2>Login</h2>

        <form id="login-form">
            <label>Email:</label>
            <input type="email" id="email" required>

            <button type="submit">Login</button>
        </form>

        <p>Don't have an account?
            <a href="#" id="show-registration">Create User</a>
        </p>
    </section>

    <!-- Registration -->
    <section id="registration-section" hidden>
        <h2>Create User</h2>

        <form id="registration-form">
            <label>Username:</label>
            <input type="text" id="username" required>

            <label>Email:</label>
            <input type="email" id="reg-email" required>

            <label>Roll Number:</label>
            <input type="text" id="roll-number" required>

            <label>Initial Casual Leave:</label>
            <input type="number" id="casual-leave" min="0" value="10" required>

            <label>Initial Medical Leave:</label>
            <input type="number" id="medical-leave" min="0" value="6" required>

            <button type="submit">Register</button>
        </form>

        <p>Already have an account?
            <a href="#" id="show-login">Login</a>
        </p>
    </section>

    <!-- Dashboard -->
    <section id="dashboard-section" hidden>

        <h2>Leave Balance</h2>

        <p>Welcome, <strong id="username-display"></strong>
            (Roll Number: <span id="roll-number-display"></span>)
        </p>

        <div class="balance-card">
            <p>Casual Leave:
                <strong id="casual-leave-display">10</strong>
            </p>

            <p>Medical Leave:
                <strong id="medical-leave-display">6</strong>
            </p>
        </div>

        <button type="button" id="refresh-balance">
            Refresh Balance
        </button>

        <button type="button" id="logout-button" class="logout">
            Logout
        </button>

        <div class="leave-card">
            <h2>Apply for Leave</h2>

            <form id="leave-form">
                <label>Leave Type:</label>

                <select id="leave-type" required>
                    <option value="casual">Casual</option>
                    <option value="medical">Medical</option>
                </select>

                <label>Number of Days:</label>
                <input type="number" id="leave-days"
                       min="1" step="1" required>

                <button type="submit">Apply Leave</button>
            </form>
        </div>

        <p id="response-message"></p>
    </section>

    <p id="registration-response"></p>

</div>

<script src="app.js"></script>
</body>
</html>
